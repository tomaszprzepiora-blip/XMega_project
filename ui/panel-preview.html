<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XMEGA Domoticz Panel Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --panel: #1b2028;
      --line: #303844;
      --text: #eef2f6;
      --muted: #98a5b3;
      --green: #32c36c;
      --amber: #f0b429;
      --blue: #3994ff;
      --red: #ff5d5d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d0f13;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    main {
      width: min(96vw, 760px);
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .screen-shell {
      padding: 14px;
      background: #07080a;
      border: 1px solid #252a31;
    }

    .screen {
      width: min(92vw, 640px);
      aspect-ratio: 4 / 3;
      image-rendering: pixelated;
      background: var(--bg);
      position: relative;
      overflow: hidden;
      border: 1px solid #46505c;
    }

    .stage {
      width: 320px;
      height: 240px;
      transform-origin: top left;
      position: absolute;
      inset: 0;
      background: var(--bg);
    }

    .top {
      height: 96px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #151922;
    }

    .status-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      line-height: 1.2;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
    }

    .chip {
      color: #07120d;
      background: var(--green);
      padding: 3px 6px;
      font-weight: 700;
    }

    .temps {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .temp {
      padding: 6px;
      border: 1px solid var(--line);
      background: #1d232d;
      min-height: 44px;
    }

    .temp span {
      display: block;
      color: var(--muted);
      font-size: 9px;
      line-height: 1;
    }

    .temp strong {
      display: block;
      margin-top: 4px;
      font-size: 18px;
      line-height: 1;
    }

    .controls {
      height: 144px;
      padding: 4px 6px 6px;
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 40px);
      gap: 6px 4px;
    }

    button {
      border: 1px solid #3b4654;
      background: var(--panel);
      color: var(--text);
      font: 700 12px/1 system-ui, sans-serif;
      padding: 0;
      min-width: 0;
      cursor: pointer;
    }

    button.on {
      border-color: #48d985;
      background: #10351f;
      color: #d8ffe8;
    }

    button.warn {
      border-color: #805151;
      color: #ffd7d7;
    }

    button.sync {
      border-color: #3c68a0;
      color: #d7e8ff;
    }

    .log {
      width: min(96vw, 640px);
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid #28313c;
      background: #11161d;
      color: var(--muted);
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <div class="screen-shell">
      <div class="screen" id="screen">
        <div class="stage" id="stage">
          <section class="top">
            <div class="status-row">
              <div>
                <div class="title">Domoticz Panel</div>
                <div>ESP UART: gotowy</div>
              </div>
              <div class="chip">3.3V</div>
            </div>
            <div class="temps">
              <div class="temp"><span>Salon</span><strong id="t1">21.6</strong></div>
              <div class="temp"><span>Sypialnia</span><strong id="t2">20.4</strong></div>
              <div class="temp"><span>Zewn.</span><strong id="t3">14.8</strong></div>
            </div>
          </section>
          <section class="controls">
            <button data-idx="32">Lozko Aga</button>
            <button data-idx="33">Lozko Tomek</button>
            <button data-idx="34">Biurko</button>
            <button data-idx="76">Dock Station</button>
            <button data-idx="57">Salon Spr.</button>
            <button class="warn" data-cmd="all-off">All Off</button>
            <button data-cmd="idx:39:?">Temp 1</button>
            <button data-cmd="idx:40:?">Temp 2</button>
            <button class="sync" data-cmd="sync">Sync</button>
          </section>
        </div>
      </div>
    </div>
    <div class="log" id="log">Nacisnij kontrolke, zeby zobaczyc komende UART.</div>
  </main>

  <script>
    const screen = document.getElementById('screen');
    const stage = document.getElementById('stage');
    const log = document.getElementById('log');
    const switchButtons = document.querySelectorAll('button[data-idx]');
    const tempIdx = [39, 40, 42];

    function fit() {
      const rect = screen.getBoundingClientRect();
      const scale = rect.width / 320;
      stage.style.transform = `scale(${scale})`;
    }

    for (const button of switchButtons) {
      button.addEventListener('click', () => {
        const idx = button.dataset.idx;
        const on = !button.classList.contains('on');
        button.classList.toggle('on', on);
        log.textContent = `UART -> ESP: idx:${idx}:${on ? 1 : 0}`;
      });
    }

    document.querySelector('button[data-cmd="all-off"]').addEventListener('click', () => {
      const lines = [];
      for (const button of switchButtons) {
        button.classList.remove('on');
        lines.push(`idx:${button.dataset.idx}:0`);
      }
      log.textContent = `UART -> ESP:\n${lines.join('\n')}`;
    });

    document.querySelector('button[data-cmd="sync"]').addEventListener('click', () => {
      const idx = [...switchButtons].map((b) => b.dataset.idx).concat(tempIdx);
      log.textContent = `UART -> ESP:\n${idx.map((i) => `idx:${i}:?`).join('\n')}`;
    });

    for (const button of document.querySelectorAll('button[data-cmd]:not([data-cmd="all-off"]):not([data-cmd="sync"])')) {
      button.addEventListener('click', () => {
        log.textContent = `UART -> ESP: ${button.dataset.cmd}`;
      });
    }

    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
